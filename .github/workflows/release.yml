# Build and publish i18n-mirror: fully static (musl) Linux wheels for x86_64 and
# aarch64 tagged for both manylinux (2_17 / 2014) and musllinux_1_2, plus an sdist.
# The CLI is a pure Rust binary (maturin `bin` bindings), so wheels are
# ABI-independent: no Python-version matrix.
#
# Publishing: push a tag (v*). Uploads wheels + sdist to the GitHub Release and
# publishes to PyPI via trusted publishing (configure the environment "pypi"
# at https://pypi.org/manage/account/publishing/ for your repository).

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo fmt --check && cargo clippy -- -D warnings

  wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64 }
          - { os: ubuntu-22.04, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build static wheel
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2 # fully static
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Add manylinux platform tags to static wheel
        run: |
          python3 -m pip install --quiet wheel
          python3 -m wheel tags --remove \
            --platform-tag "manylinux_2_17_${{ matrix.target }}.manylinux2014_${{ matrix.target }}.musllinux_1_2_${{ matrix.target }}" \
            dist/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}-static
          path: dist

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # attach wheels to the GitHub Release
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
