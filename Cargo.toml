[package]
name = "i18n-mirror"
version = "0.1.0"
edition = "2021"
description = "Mirror gettext-style calls in modern JS/TS/JSX sources into xgettext-safe dummy files, preserving file names and line numbers (built for Django makemessages djangojs)"
license = "MIT"
readme = "README.md"
keywords = ["i18n", "gettext", "django", "react", "typescript"]
categories = ["command-line-utilities", "internationalization", "development-tools"]
exclude = ["examples/*", ".github/*", "dist/*"]

[dependencies]
anyhow = "1"
walkdir = "2"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[profile.release]
lto = true
strip = true
